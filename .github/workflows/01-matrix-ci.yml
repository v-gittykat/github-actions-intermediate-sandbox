name: "Lab 1-2 · Matrix CI with cache and artifacts"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.12"
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            publish-report: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Locate the pip cache folder
        id: pip-cache
        shell: bash
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload test report
        if: ${{ always() && matrix.publish-report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: reports/junit.xml
          retention-days: 5

  report:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit-report
          path: reports

      - name: Summarize the report
        shell: python
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/junit.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          counts = [suite.get(k) for k in ("tests", "failures", "errors", "skipped")]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Test report (ubuntu-latest, py3.14)\n\n")
              out.write("| Tests | Failures | Errors | Skipped |\n|---|---|---|---|\n")
              out.write("| " + " | ".join(counts) + " |\n\n")
              out.write(f"Matrix result: **{os.environ['MATRIX_RESULT']}**\n")
