name: Set up Python and run tests
description: Installs Python and test dependencies, runs pytest and exposes the result line.

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.13"
  test-path:
    description: Folder that contains the tests
    required: false
    default: tests
  install-dependencies:
    description: Set to "false" to skip pip install
    required: false
    default: "true"

outputs:
  result-line:
    description: Last line of the pytest output
    value: ${{ steps.pytest.outputs.result-line }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt

    # Composite action steps support `if` conditionals.
    - name: Install test dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: python -m pip install -r requirements-dev.txt

    - name: Run pytest
      id: pytest
      shell: bash
      env:
        TEST_PATH: ${{ inputs.test-path }}
      run: |
        set -o pipefail
        python -m pytest "$TEST_PATH" -q | tee pytest.log
        echo "result-line=$(tail -n 1 pytest.log)" >> "$GITHUB_OUTPUT"
